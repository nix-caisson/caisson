name: drift
# The checks that hold caisson's expectations of the upstreams, against
# today's upstreams. The pins in tests/dependencies/flake.lock are
# advanced in the working tree, committing nothing, and those checks
# are built over them. Red here means an upstream pin moved and broke an
# expectation caisson holds, not that caisson changed: the committed
# pins are the last known good and move only in the commit that fixes
# what the advance broke. The checks are built by name rather than the
# whole `nix flake check`, whose eval-weight baseline and formatter
# would report nixpkgs churn as failures.
#
# The pinned-world suite (tests/pinned-world) evaluates. The other
# checks run the upstream tools: the VM test of the profiles runs
# hjem's CLI and caisson's copies of the units of hjem, and the darwin
# job applies a standalone hjem configuration and activates a machine on
# a macOS runner. What they rely on of hjem, such as where
# `hjem standalone switch` keeps its state, is not part of an interface
# hjem documents, so only running it shows that it still holds.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - run: nix flake update --flake ./tests/dependencies
      - run: nix build -L '.#checks.x86_64-linux.pinned-world'
      - run: nix build -L '.#checks.x86_64-linux.hjem-system'
      - run: nix build -L '.#checks.x86_64-linux.drift-message'
      - run: nix build -L '.#checks.x86_64-linux.profile-vm'
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false
      - run: nix flake update --flake ./tests/dependencies
      - run: nix build -L '.#checks.aarch64-darwin.darwin-system'
      - run: bash tests/darwin-system/hjem-standalone.sh "$(readlink -f result)"
      - run: bash tests/darwin-system/runner-machine.sh "$(readlink -f result)"
