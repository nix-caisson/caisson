name: drift
# The pinned-world suite (tests/pinned-world) against today's upstreams.
# The pins in tests/dependencies/flake.lock are advanced in the working
# tree, committing nothing, and the suite check alone is built over
# them. Red here means an upstream pin moved and broke an expectation
# caisson holds, not that caisson changed: the committed pins are the
# last known good and move only in the commit that fixes what the
# advance broke. The suite check is built alone rather than the whole
# `nix flake check`, whose eval-weight baseline and formatter would
# report nixpkgs churn as failures of their own.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  pinned-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Upstream Nix, not Determinate Nix: the action has
          # defaulted determinate to true since v21, and this
          # project targets the Nix everyone else runs.
          determinate: false
      - run: nix flake update --flake ./tests/dependencies
      - run: nix build -L '.#checks.x86_64-linux.pinned-world'
